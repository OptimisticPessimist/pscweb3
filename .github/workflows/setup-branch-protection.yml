name: Setup Branch Protection

on:
  workflow_dispatch:

# NOTE: ブランチ保護APIには管理者権限が必要だが、GITHUB_TOKEN には
# administration 権限を付与できない（workflow permissions に存在しないスコープで、
# 指定するとワークフロー自体がパースエラーになる）。
# リポジトリ管理者権限を持つ Fine-grained PAT (Administration: Read and write) を
# BRANCH_PROTECTION_TOKEN シークレットに登録して実行すること。
permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Configure required status checks on main
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::BRANCH_PROTECTION_TOKEN シークレットが未設定です。管理者権限のPATを登録してください。"
            exit 1
          fi

          EXISTING=$(gh api \
            "repos/${{ github.repository }}/branches/main/protection" \
            2>/dev/null || echo '{}')

          echo "$EXISTING" | jq '{
            required_status_checks: {
              strict: false,
              contexts: ["test_backend", "test_frontend"]
            },
            enforce_admins: (.enforce_admins.enabled // false),
            required_pull_request_reviews: (
              if .required_pull_request_reviews then {
                dismiss_stale_reviews: (.required_pull_request_reviews.dismiss_stale_reviews // false),
                require_code_owner_reviews: (.required_pull_request_reviews.require_code_owner_reviews // false),
                required_approving_review_count: (.required_pull_request_reviews.required_approving_review_count // 0)
              } else null end
            ),
            restrictions: null
          }' | gh api \
            --method PUT \
            "repos/${{ github.repository }}/branches/main/protection" \
            --input -
